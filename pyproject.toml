[project]
name = "rag-agent"
version = "0.1.0"
description = "iMarine LLM+RAG 政策輔助報告管線"
requires-python = ">=3.13"
dependencies = [
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    # Schema & validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # Database
    "sqlmodel>=0.0.22",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.5",
    # ML
    "torch>=2.5.0",
    "transformers==5.8.0",
    "sentence-transformers>=3.3.0",
    "accelerate>=1.2.0",
    # Ingestion
    "feedparser>=6.0.11",
    "httpx>=0.28.0",
    "lxml>=5.3.0",
    "beautifulsoup4>=4.12.0",
    "pypdf>=5.1.0",
    "python-docx>=1.1.2",
    # Utilities
    "python-dateutil>=2.9.0",
    "tenacity>=9.0.0",
    "pdfplumber>=0.11.10",
    "streamlit>=1.58.0",
    "nest-asyncio>=1.6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_agent"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
